services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: smart_inventory
      POSTGRES_USER: inventory
      POSTGRES_PASSWORD: inventory_dev_only
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U inventory -d smart_inventory"]
      interval: 5s
      retries: 10
  backend:
    build: ./backend
    environment:
      DB_URL: jdbc:postgresql://db:5432/smart_inventory
      DB_USER: inventory
      DB_PASSWORD: inventory_dev_only
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
  frontend:
    build: ./frontend
    environment:
      API_PROXY_TARGET: http://backend:8080
    ports:
      - "5173:5173"
    depends_on:
      - backend
volumes:
  pgdata:
